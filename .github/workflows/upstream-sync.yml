name: Upstream sync

# Keeps this downstream fork on upstream/main with ordinary merge commits and
# ships each upstream version as a fork Release, so updates never replace the
# fork's own capabilities with an upstream build.
#
# - Nothing new and the current version already released: exits quietly.
# - New upstream commits: merges them, runs the fork contract and
#   `npm run check`, then fast-forwards main (never force).
# - main's version has no fork Release yet: tags it, dispatches CI on main and
#   the Release workflow (installers only; npm belongs to upstream).
# - Anything needing judgment (conflicts outside the routine allowlist,
#   upstream workflow edits the token cannot push, failed checks) fails with
#   evidence instead.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: BytePioneer-AI/codex-host
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  sync:
    name: Sync and release
    if: github.repository_owner == 'TinyYana'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect upstream progress
        id: detect
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          echo "upstream_sha=${upstream_sha}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream main
        id: merge
        if: steps.detect.outputs.merge == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          message="merge: sync upstream ${UPSTREAM_REPOSITORY} main (${UPSTREAM_SHA:0:8})"
          if ! git merge --no-ff --no-edit -m "${message}" upstream/main; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            # Routine conflicts stay deterministic:
            # - version files keep the higher semver side
            # - a small release/renderer allowlist keeps upstream side
            routine_conflicts='package\.json|package-lock\.json|Cargo\.toml|Cargo\.lock|packages/renderer-extension/src/renderer-binding-probe\.ts|packages/renderer-extension/src/renderer-model-client\.ts|packages/renderer-extension/test/renderer-model-client\.test\.ts|scripts/release/prepare-npm\.mjs|scripts/release/prepare-payload\.mjs|tests/release/npm-package\.test\.mjs|tests/release/payload\.test\.mjs'
            if [ -n "${conflicted}" ] && ! grep -qvxE "${routine_conflicts}" <<< "${conflicted}"; then
              ours="$(git show HEAD:package.json | jq -r .version)"
              theirs="$(git show upstream/main:package.json | jq -r .version)"
              if [ "$(printf '%s\n%s\n' "${ours}" "${theirs}" | sort -V | tail -n1)" = "${ours}" ]; then version_side=ours; else version_side=theirs; fi
              mapfile -t conflicted_files <<< "${conflicted}"
              for conflicted_file in "${conflicted_files[@]}"; do
                case "${conflicted_file}" in
                  package.json|package-lock.json|Cargo.toml|Cargo.lock)
                    git checkout "--${version_side}" -- "${conflicted_file}"
                    ;;
                  *)
                    git checkout --theirs -- "${conflicted_file}"
                    ;;
                esac
              done
              git add -- "${conflicted_files[@]}"
              git commit --no-edit -m "${message}"
              echo "Resolved routine upstream conflicts (version files: ${version_side}; release/renderer allowlist: upstream)." >> "$GITHUB_STEP_SUMMARY"
            else
              # Leave evidence an agent or maintainer can resolve from; never push a conflicted tree.
              mkdir -p sync-evidence
              printf '%s\n' "${conflicted}" > sync-evidence/conflicted-files.txt
              git status --porcelain=v1 > sync-evidence/status.txt
              git diff > sync-evidence/conflicts.diff
              git log --oneline "HEAD..upstream/main" > sync-evidence/upstream-commits.txt
              {
                echo "## Upstream merge conflict"
                echo
                echo "Merging ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA} into main stopped on conflicts. Resolve with"
                echo "\`git fetch upstream && git merge upstream/main\` on main, keeping the capabilities in"
                echo "\`packages/repository-automation/test/fork-contract.test.mjs\`, then push; the next run releases it."
                echo
                echo '```text'
                cat sync-evidence/conflicted-files.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Upstream merge conflicts; see the job summary and the upstream-sync-conflict artifact."
              exit 1
            fi
          fi
          # GITHUB_TOKEN cannot push workflow changes; a person pushes this merge instead.
          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            {
              echo "## Upstream changed workflows"
              echo
              echo "GitHub does not let workflow tokens push \`.github/workflows\` changes. Run locally:"
              echo
              echo '```bash'
              echo "git switch main && git pull && git fetch upstream && git merge upstream/main && npm run check && git push"
              echo '```'
              echo
              echo "The next run releases the merged version."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Upstream changed .github/workflows; push this merge manually (see the job summary)."
            exit 1
          fi

      - name: Upload conflict evidence
        if: failure() && steps.merge.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-conflict
          path: sync-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(jq -r .version package.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.detect.outputs.merge == 'false' && steps.release.outputs.needed == 'false'
        run: echo "main contains ${UPSTREAM_REPOSITORY}@${{ steps.detect.outputs.upstream_sha }} and v${{ steps.release.outputs.version }} is released." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.detect.outputs.merge == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        if: steps.detect.outputs.merge == 'true'
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        if: steps.detect.outputs.merge == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install dependencies
        if: steps.detect.outputs.merge == 'true'
        run: npm ci --prefer-offline

      # Fails fast and by name when a merge dropped a fork capability or its tests.
      - name: Check fork contract
        if: steps.detect.outputs.merge == 'true'
        run: npx vitest run --config tests/vitest.config.js packages/repository-automation/test/fork-contract.test.mjs

      - name: Repository check
        if: steps.detect.outputs.merge == 'true'
        run: npm run check

      # A plain push: it is rejected, not forced, if main moved during the run.
      - name: Fast-forward main
        if: steps.detect.outputs.merge == 'true'
        run: git push origin HEAD:refs/heads/main

      - name: Release fork build
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # gh would otherwise resolve the upstream remote as the target repository.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          tag="v${VERSION}"
          # A rerun after a failed dispatch reuses the tag it already pushed.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            git tag -a "${tag}" -F - <<EOF
          codexhost ${VERSION}

          ${GITHUB_REPOSITORY} build of ${UPSTREAM_REPOSITORY} at ${UPSTREAM_SHA:0:8}, keeping the fork's Codex managed accounts and Claude Code Goal bridge.
          Upstream changes: https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${tag}
          EOF
            git push origin "refs/tags/${tag}"
            # Pushes made with GITHUB_TOKEN trigger no workflows: run CI on main, which the
            # Release workflow waits for as its exact-commit evidence.
            gh workflow run ci.yml --ref main
          fi
          gh workflow run release-packages.yml --ref main -f tag="${tag}" -f skip_npm=true
          echo "Dispatched Release packages for ${tag}." >> "$GITHUB_STEP_SUMMARY"
